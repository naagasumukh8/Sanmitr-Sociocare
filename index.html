<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanmitr Sociocare</title>
<style>
:root{--ink:#10203a;--muted:#66748b;--line:#e7ebf2;--blue:#4169e1;--green:#20a35a;--red:#e04b4b;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.nav{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:10}.brand{font-weight:850;font-size:21px}.brand b{color:var(--blue)}.navlinks{display:flex;gap:24px;align-items:center}.navlinks a{color:#526078;font-weight:650}.pill{background:#eef3ff;color:var(--blue)!important;padding:9px 14px;border-radius:11px}.container{max-width:1120px;margin:auto;padding:70px 24px}.hero{text-align:center;margin-bottom:54px}.hero h1{font-size:clamp(42px,6vw,66px);line-height:1.04;letter-spacing:-2.7px;margin:0 0 18px}.gradient{background:linear-gradient(90deg,#2d91d6,#4169e1,#7656d6);-webkit-background-clip:text;color:transparent}.hero p{max-width:680px;margin:auto;color:var(--muted);font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:34px 28px;text-align:center;box-shadow:0 14px 40px #14213d0a;transition:.25s}.card:hover{transform:translateY(-6px)}.icon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:auto auto 22px;font-size:34px}.ed{background:#eaf1ff}.ag{background:#e9f8ef}.he{background:#fff0f0}.card h2{font-size:27px;margin:0 0 8px}.card p{color:var(--muted);min-height:48px}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 18px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer}.green{background:var(--green)}.red{background:var(--red)}.head{border-radius:25px;padding:38px;margin-bottom:30px}.head h1{margin:0 0 8px;font-size:43px}.head p{margin:0;color:#526078}.head.ed{background:#eaf1ff}.head.ag{background:#e9f8ef}.head.he{background:#fff0f0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:25px 0}.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.video{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden}.thumb{height:155px;background:#dfe7f8;display:grid;place-items:center;font-size:42px}.video .body{padding:18px}.video h3{margin:0 0 8px}.video p{color:var(--muted);font-size:14px}.price{font-weight:800;margin:12px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.modal{position:fixed;inset:0;background:#10203a66;display:grid;place-items:center;padding:20px;z-index:30}.modalbox{background:#fff;width:min(560px,100%);border-radius:22px;padding:25px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.notice{padding:14px;border-radius:12px;background:#fff8df;border:1px solid #f2df9b;color:#725c00}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.stat b{display:block;font-size:28px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}@media(max-width:800px){.grid,.videos{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.navlinks a:not(.pill){display:none}.container{padding-top:45px}}
</style></head>
<body><div id="app"></div>
<script>
const D={edtech:{n:'EdTech',i:'🎓',c:'ed',d:'Learning, education and the future of knowledge.'},agri:{n:'Agri',i:'🌱',c:'ag',d:'Technology and innovation for agriculture.'},health:{n:'Health',i:'❤',c:'he',d:'Technology for awareness, prevention and healthier lives.'}};
let videos=JSON.parse(localStorage.getItem('sv'))||[{id:1,domain:'edtech',title:'Introduction to Digital Learning',desc:'Sample learning video.',price:0},{id:2,domain:'agri',title:'Smart Farming Basics',desc:'Sample agriculture video.',price:99},{id:3,domain:'health',title:'Preventive Health Awareness',desc:'Sample awareness video.',price:0}];let buys=JSON.parse(localStorage.getItem('sb'))||[];let user=JSON.parse(localStorage.getItem('su')||'null');
const save=()=>{localStorage.setItem('sv',JSON.stringify(videos));localStorage.setItem('sb',JSON.stringify(buys))};
function nav(){return `<header class="nav"><a class="brand" href="#/">Sanmitr <b>Sociocare</b></a><nav class="navlinks"><a href="#/">Home</a><a href="#/about">About</a><a href="#/contact">Contact</a>${user?'<a class="pill" href="#/admin">Admin</a>':'<a class="pill" href="#/login">Login</a>'}</nav></header>`};function lay(x){document.querySelector('#app').innerHTML=nav()+x}
function home(){lay(`<main class="container"><section class="hero"><h1>Explore Possibilities for a <span class="gradient">Better Tomorrow</span></h1><p>Choose a domain and discover learning, agriculture and health content through one connected platform.</p></section><section class="grid">${Object.entries(D).map(([k,d])=>`<a class="card" href="#/${k}"><div class="icon ${d.c}">${d.i}</div><h2>${d.n}</h2><p>${d.d}</p><span class="btn ${k==='agri'?'green':k==='health'?'red':''}">Explore →</span></a>`).join('')}</section></main>`)}
function domain(k){let d=D[k],list=videos.filter(v=>v.domain===k);lay(`<main class="container"><a href="#/">← Back to domains</a><section class="head ${d.c}"><h1>${d.i} ${d.n}</h1><p>${d.n==='EdTech'?'Learn. Grow. Build the Future.':d.n==='Agri'?'Innovate for a Greener Tomorrow.':'Technology for a Healthier You.'}</p></section><div class="toolbar"><h2>Video Library</h2><button class="btn" onclick="upload()">＋ Upload Video</button></div><section class="videos">${list.map(v=>`<article class="video">${v.data?`<video controls style="width:100%" src="${v.data}"></video>`:`<div class="thumb">${d.i}</div>`}<div class="body"><h3>${v.title}</h3><p>${v.desc}</p><div class="price">${v.price?'₹'+v.price:'Free'}</div>${v.price&&!buys.includes(v.id)?`<button class="btn" onclick="buy(${v.id})">Unlock →</button>`:`<button class="btn" onclick="alert('Video ready to watch')">▶ Watch</button>`}</div></article>`).join('')}</section></main>`)}
function login(){lay(`<main class="container"><div class="panel" style="max-width:500px;margin:auto"><h1>Admin Login</h1><p class="notice">Prototype: <b>superadmin / 1234</b> or <b>editor / 1234</b></p><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><div class="field"><label>Role</label><select id="r"><option value="superadmin">Super Admin</option><option value="editor">Content Editor</option></select></div><button class="btn" onclick="doLogin()">Sign in</button></div></main>`)}
function doLogin(){let u=document.querySelector('#u').value,p=document.querySelector('#p').value,r=document.querySelector('#r').value;if(p!=='1234'||u!==r)return alert('Use the demo credentials shown.');user={u,role:r};localStorage.setItem('su',JSON.stringify(user));location.hash='#/admin'}
function admin(){if(!user)return location.hash='#/login';lay(`<main class="container"><div class="toolbar"><h1>Admin Dashboard</h1><button class="btn" onclick="logout()">Logout</button></div><div class="stats"><div class="stat"><b>${videos.length}</b>Total videos</div><div class="stat"><b>${buys.length}</b>Demo purchases</div><div class="stat"><b>${user.role}</b>Access level</div></div><div class="panel"><h2>Content Management</h2><p>Upload videos and control free/paid content.</p><button class="btn" onclick="upload()">＋ Upload Video</button><table class="table"><tr><th>Title</th><th>Domain</th><th>Price</th><th></th></tr>${videos.map(v=>`<tr><td>${v.title}</td><td>${D[v.domain].n}</td><td>${v.price?'₹'+v.price:'Free'}</td><td><button class="btn" onclick="removeV(${v.id})">Remove</button></td></tr>`).join('')}</table></div></main>`)}
function upload(){if(!user)return location.hash='#/login';modal(`<h2>Upload Video</h2><div class="field"><label>Title</label><input id="t"></div><div class="field"><label>Description</label><input id="x"></div><div class="field"><label>Domain</label><select id="d">${Object.entries(D).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div><div class="field"><label>Price (0 = free)</label><input id="q" type="number" value="0"></div><div class="field"><label>Video file</label><input id="f" type="file" accept="video/*"></div><div class="actions"><button class="btn" onclick="closeM()">Cancel</button><button class="btn" onclick="saveV()">Upload</button></div>`)}
function saveV(){let f=document.querySelector('#f').files[0],t=document.querySelector('#t').value;if(!f||!t)return alert('Add a title and video.');let r=new FileReader();r.onload=()=>{videos.push({id:Date.now(),domain:document.querySelector('#d').value,title:t,desc:document.querySelector('#x').value||'Uploaded content',price:+document.querySelector('#q').value||0,data:r.result});save();closeM();location.hash='#/admin'};r.readAsDataURL(f)}
function removeV(id){videos=videos.filter(v=>v.id!==id);save();admin()}function buy(id){let v=videos.find(x=>x.id===id);modal(`<h2>Demo Checkout</h2><p>Unlock <b>${v.title}</b> for <b>₹${v.price}</b>.</p><p class="notice">Razorpay integration will replace this demo payment layer later.</p><div class="actions"><button class="btn" onclick="closeM()">Cancel</button><button class="btn" onclick="buys.push(${id});save();closeM();route()">Pay ₹${v.price}</button></div>`)}function modal(x){let m=document.createElement('div');m.id='m';m.className='modal';m.innerHTML='<div class="modalbox">'+x+'</div>';document.body.appendChild(m)}function closeM(){document.querySelector('#m')?.remove()}function logout(){user=null;localStorage.removeItem('su');location.hash='#/'}
function simple(t,p){lay(`<main class="container"><div class="panel" style="max-width:760px;margin:auto;text-align:center;padding:65px"><h1>${t}</h1><p style="color:var(--muted);font-size:18px">${p}</p><a class="btn" href="#/">Back Home</a></div></main>`)}function route(){let p=location.hash.slice(1)||'/';if(p==='/')home();else if(p==='/login')login();else if(p==='/admin')admin();else if(p==='/about')simple('About Sanmitr Sociocare','A connected platform for education, agriculture and health initiatives.');else if(p==='/contact')simple('Contact','Contact details and enquiry forms can be connected here.');else if(D[p.slice(1)])domain(p.slice(1));else home()}window.addEventListener('hashchange',route);route();
</script></body></html>
